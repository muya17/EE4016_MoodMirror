name: E4_SGD_constant
model: SimpleCNN
data_path: ../../data/fer2013
batch_size: 256
augment: true
training:
  epochs: 50
  optimizer: SGD
  lr: 0.001
  weight_decay: 0.0001
  dropout_rate: 0.5
  lr_scheduler:
    enabled: false
    type: null
    params: {}
  momentum: 0.9
logging:
  log_dir: ../runs
  save_model: true
  save_freq: 5
seed: 42
