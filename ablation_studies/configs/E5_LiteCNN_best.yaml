name: E5_LiteCNN_best
model: LiteCNN
data_path: ../../data/fer2013
batch_size: 256
augment: true
training:
  epochs: 50
  optimizer: Adam
  lr: 0.001
  weight_decay: 0.0001
  dropout_rate: 0.3
  lr_scheduler:
    enabled: true
    type: CosineAnnealingLR
    params:
      T_max: 50
logging:
  log_dir: ../runs
  save_model: true
  save_freq: 5
seed: 42
